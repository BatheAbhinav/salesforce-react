<template>
    <lightning-card title={cardTitle} icon-name={iconName}>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <template if:true={hasError}>
            <div class="slds-text-color_error slds-var-p-horizontal_medium">{errorMessage}</div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-text-color_weak slds-var-p-horizontal_medium">No records found.</div>
        </template>

        <template if:true={hasRecords}>
            <div class="slds-grid slds-wrap slds-gutters slds-var-p-horizontal_medium">
                <template for:each={records} for:item="record">
                    <div key={record.recordId} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-bottom_medium">
                        <article class="slds-card slds-card_boundary">
                            <div class="slds-card__header slds-grid">
                                <h3 class="slds-card__header-title slds-truncate" title={record.title}>{record.title}</h3>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <template for:each={record.fields} for:item="field">
                                        <div key={field.label}>
                                            <dt class="slds-item_label slds-text-color_weak slds-truncate" title={field.label}>{field.label}</dt>
                                            <dd class="slds-item_detail slds-truncate">{field.value}</dd>
                                        </div>
                                    </template>
                                </dl>
                            </div>
                        </article>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
